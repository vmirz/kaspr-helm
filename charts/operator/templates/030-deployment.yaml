{{- if .Values.operator -}}
{{- if .Values.operator.enable -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kaspr.operator.fullname" . }}
  namespace: {{ include "kaspr.operator.namespace" . }}
  labels:
    {{- include "kaspr.operator.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "kaspr.operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.operator.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "kaspr.operator.labels" . | nindent 8 }}
        {{- with .Values.operator.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.operator.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "kaspr.operator.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.operator.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.operator.securityContext | nindent 12 }}
          image: "{{ .Values.operator.image.repository }}:{{ .Values.operator.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
          command: ["python3"]
          args:
            - /usr/src/app/run_operator.py
            {{- if .Values.operator.watchAnyNamespace }}
            - --all-namespaces
            {{- else }}
            {{- $ns := .Values.operator.watchNamespaces -}}
            {{- $opns := include "kaspr.operator.namespace" . -}}
            {{- $ns := append $ns $opns }}
            {{- range $ns }}
            - --namespace={{ . }}
            {{- end }}
            {{- end }}
          env:
            {{- if .Values.operator.env.initialMaxReplicas }}
            - name: INITIAL_MAX_REPLICAS
              value: "{{ .Values.operator.env.initialMaxReplicas }}"
            {{- end }}
            {{- if .Values.operator.env.hpaScaleUpPolicyPodsPerStep }}
            - name: HPA_SCALE_UP_POLICY_PODS_PER_STEP
              value: "{{ .Values.operator.env.hpaScaleUpPolicyPodsPerStep }}"
            {{- end }}
            {{- if .Values.operator.env.hpaScaleUpPolicyPeriodSeconds }}
            - name: HPA_SCALE_UP_POLICY_PERIOD_SECONDS
              value: "{{ .Values.operator.env.hpaScaleUpPolicyPeriodSeconds }}"
            {{- end }}
            {{- if .Values.operator.env.statefulsetDeletionTimeoutSeconds }}
            - name: STATEFULSET_DELETION_TIMEOUT_SECONDS
              value: "{{ .Values.operator.env.statefulsetDeletionTimeoutSeconds }}"
            {{- end }}
            {{- if ne (toString .Values.operator.env.clientStatusCheckEnabled) "" }}
            - name: CLIENT_STATUS_CHECK_ENABLED
              value: "{{ .Values.operator.env.clientStatusCheckEnabled }}"
            {{- end }}
            {{- if .Values.operator.env.clientStatusCheckTimeoutSeconds }}
            - name: CLIENT_STATUS_CHECK_TIMEOUT_SECONDS
              value: "{{ .Values.operator.env.clientStatusCheckTimeoutSeconds }}"
            {{- end }}
            {{- if ne (toString .Values.operator.env.statusUpdateIntervalSeconds) "" }}
            - name: STATUS_UPDATE_INTERVAL_SECONDS
              value: "{{ .Values.operator.env.statusUpdateIntervalSeconds }}"
            {{- end }}
            {{- if ne (toString .Values.operator.env.reconcileIntervalSeconds) "" }}
            - name: RECONCILE_INTERVAL_SECONDS
              value: "{{ .Values.operator.env.reconcileIntervalSeconds }}"
            {{- end }}
            {{- if ne (toString .Values.operator.env.autoRebalanceEnabled) "" }}
            - name: AUTO_REBALANCE_ENABLED
              value: "{{ .Values.operator.env.autoRebalanceEnabled }}"
            {{- end }}
            {{- if ne (toString .Values.operator.env.rebalanceCheckIntervalSeconds) "" }}
            - name: REBALANCE_CHECK_INTERVAL_SECONDS
              value: "{{ .Values.operator.env.rebalanceCheckIntervalSeconds }}"
            {{- end }}
            {{- if ne (toString .Values.operator.env.rebalanceVerifyDelaySeconds) "" }}
            - name: REBALANCE_VERIFY_DELAY_SECONDS
              value: "{{ .Values.operator.env.rebalanceVerifyDelaySeconds }}"
            {{- end }}
            {{- if ne (toString .Values.operator.env.rebalanceMaxAttempts) "" }}
            - name: REBALANCE_MAX_ATTEMPTS
              value: "{{ .Values.operator.env.rebalanceMaxAttempts }}"
            {{- end }}
            {{- if ne (toString .Values.operator.env.rebalanceVerifyTimeoutSeconds) "" }}
            - name: REBALANCE_VERIFY_TIMEOUT_SECONDS
              value: "{{ .Values.operator.env.rebalanceVerifyTimeoutSeconds }}"
            {{- end }}
            {{- if ne (toString .Values.operator.env.hungMemberDetectionEnabled) "" }}
            - name: HUNG_MEMBER_DETECTION_ENABLED
              value: "{{ .Values.operator.env.hungMemberDetectionEnabled }}"
            {{- end }}
            {{- if .Values.operator.env.hungRebalancingThresholdSeconds }}
            - name: HUNG_REBALANCING_THRESHOLD_SECONDS
              value: "{{ .Values.operator.env.hungRebalancingThresholdSeconds }}"
            {{- end }}
            {{- if .Values.operator.env.kasprImageRegistry }}
            - name: KASPR_IMAGE_REGISTRY
              value: "{{ .Values.operator.env.kasprImageRegistry }}"
            {{- end }}
            {{- if .Values.operator.env.pythonPackagesInitImage }}
            - name: PYTHON_PACKAGES_INIT_IMAGE
              value: "{{ .Values.operator.env.pythonPackagesInitImage }}"
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.operator.service.port }}
              protocol: TCP
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
      {{- with .Values.operator.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}